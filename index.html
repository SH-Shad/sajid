<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sajid's pixel city</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f2e8cf; --panel:#1d2340; --panel-hi:#2a3260; --gold:#f6c85f; --gold-lo:#c9982f;
  --board:#0e1320; --muted:#9fb3d9; --line:#5a6598; --forest:#2e6a45;
  --page-bg:#f2e8cf; --page-ink:#1d2340; --page-line:#c9b98f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#151a31; --page-ink:#f2e8cf; --page-line:#39406a; }
}
:root[data-theme="dark"]{ --page-bg:#151a31; --page-ink:#f2e8cf; --page-line:#39406a; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--forest);overflow:hidden;color:var(--ink);font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.panel{background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--panel),5px 5px 0 3px rgba(0,0,0,.35)}
.hud{position:fixed;z-index:5;pointer-events:none;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hud-right{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.hud-left{display:flex;flex-wrap:wrap;gap:10px}
.chip{pointer-events:auto;padding:7px 11px;font:600 15px/1.25 "Pixelify Sans",ui-monospace,monospace}
.chip strong{font:13px/1.3 Silkscreen,ui-monospace,monospace;color:var(--gold);display:block;font-weight:400}
button.chip,a.chip{cursor:pointer;text-decoration:none}
button.chip:hover,a.chip:hover{background:var(--panel-hi)}
a.chip.gold{background:var(--gold);color:var(--panel)}

.mini{position:fixed;z-index:3;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:160px;height:120px;image-rendering:pixelated;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--panel)}
@media (max-width:760px),(max-height:520px){.mini{display:none}}
.prompt{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);max-width:calc(100% - 130px);padding:8px 12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tourbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:flex;gap:10px;align-items:center;padding:6px 8px 6px 12px;font-size:15px;max-width:calc(100% - 28px)}
.toast{position:fixed;z-index:12;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);padding:8px 14px;font-size:16px;max-width:calc(100% - 28px);text-align:center}
.act{position:fixed;z-index:4;width:62px;height:62px;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--gold);color:var(--panel);border:3px solid var(--panel);box-shadow:inset -4px -4px 0 var(--gold-lo),4px 4px 0 rgba(0,0,0,.35);font:24px/1 Silkscreen,monospace;cursor:pointer}

.dialog{position:fixed;z-index:10;left:0;right:0;display:flex;justify-content:center;padding:0 14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.dlg{width:100%;max-width:660px;max-height:min(76vh,640px);overflow:auto;padding:16px 18px 12px}
.dlg h2{font:16px/1.35 Silkscreen,ui-monospace,monospace;font-weight:400;color:var(--gold);margin:0 0 10px}
.dlg p{font-size:18px;line-height:1.5;margin:0 0 12px;max-width:62ch}
.dlg p.small,.small{font-size:14px;line-height:1.45;color:var(--muted)}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;font-size:14px;color:var(--muted)}

.board{background:var(--board);border:2px solid #39406a;padding:8px 12px;margin:0 0 12px;font:12px/1.9 Silkscreen,ui-monospace,monospace;color:var(--gold)}
.board div{display:flex;justify-content:space-between;gap:16px}
.board span:first-child{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.tags li{border:2px solid var(--line);padding:2px 7px;font-size:14px;color:#c9d2ee}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
.btn{display:inline-block;background:var(--gold);color:var(--panel);text-decoration:none;border:none;cursor:pointer;font:600 15px/1.1 "Pixelify Sans",ui-monospace,monospace;padding:9px 12px;box-shadow:inset -3px -3px 0 var(--gold-lo)}
.btn:hover{background:#ffd978}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{background:var(--panel-hi)}
.btn.tab[aria-selected="true"]{background:var(--gold);color:var(--panel);box-shadow:inset -3px -3px 0 var(--gold-lo)}

.w{margin:0 0 12px}
.w label{display:block;font-size:15px;color:var(--muted);margin:10px 0 4px}
.w input[type=range]{width:100%;accent-color:var(--gold)}
.w select,.w input[type=text],.w textarea{width:100%;font:16px "Pixelify Sans",ui-monospace,monospace;background:var(--board);color:var(--ink);border:2px solid var(--line);padding:6px 8px;border-radius:0}
.w textarea{min-height:64px;resize:vertical}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.meter{height:16px;background:var(--board);border:2px solid var(--line);margin:12px 0 6px}
.meter i{display:block;height:100%;transition:width .2s}
.flights{width:100%;border-collapse:collapse;margin:10px 0;font:12px/1.9 Silkscreen,ui-monospace,monospace;background:var(--board)}
.flights th,.flights td{text-align:left;padding:2px 8px;border-bottom:1px solid #262d4d;font-weight:400}
.flights th{color:var(--muted)}
.ok{color:#7ee787}.warn{color:var(--gold)}.bad,.dlg p.small.bad{color:#ff8a7a}
pre.sql{background:var(--board);color:#9fd0e6;border:2px solid #39406a;padding:8px 10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:10px 0;min-height:3em}
.term{background:#0b0f1a;color:#7ee787;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;height:190px;overflow:auto;border:2px solid #39406a;white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px;font:14px ui-monospace,Menlo,Consolas,monospace;color:#7ee787}
.term-in input{flex:1;font:14px ui-monospace,Menlo,Consolas,monospace !important;color:#7ee787 !important}
.list{margin:0 0 12px;padding-left:1.1em}
.list li{margin:4px 0;font-size:16px;line-height:1.45}
.group-title{font:13px/1.4 Silkscreen,ui-monospace,monospace;color:var(--gold);margin:14px 0 6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0 0 12px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid var(--ink)}
.social{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #262d4d;flex-wrap:wrap}
.social-name{font:12px/1.4 Silkscreen,ui-monospace,monospace;color:var(--gold);min-width:84px}
.social-url{flex:1;min-width:120px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9d2ee}
.classic .social-url{color:inherit}.classic .social{border-color:var(--page-line)}
.medal{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}

.sheet{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(10,14,30,.6);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet .panel{width:100%;max-width:740px;max-height:100%;overflow:auto;padding:18px}
.sheet h2{font:17px/1.35 Silkscreen,ui-monospace,monospace;font-weight:400;color:var(--gold);margin:0}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.slot{background:#141a33;border:2px solid #39406a;padding:8px;font-size:15px;min-height:42px;box-shadow:inset 2px 2px 0 #242c52}
#bigMap{width:100%;max-width:640px;display:block;margin:0 auto;image-rendering:pixelated;border:2px solid #39406a}
.districts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.classic{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--page-bg);color:var(--page-ink);padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 48px)}
.classic .wrap{max-width:700px;margin:0 auto}
.classic .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.classic h1{font:22px/1.3 Silkscreen,ui-monospace,monospace;font-weight:400;margin:0}
.classic .lede{font-size:17px;margin:4px 0 12px;opacity:.8}
.classic h2{font:18px/1.3 Silkscreen,ui-monospace,monospace;font-weight:400;margin:34px 0 0;padding-bottom:8px;border-bottom:3px solid var(--page-line)}
.classic section{padding:18px 0 4px}
.classic h3{font:15px/1.35 Silkscreen,ui-monospace,monospace;font-weight:400;margin:0 0 8px}
.classic p{font-size:18px;line-height:1.55;margin:0 0 12px}
.classic .tags li{border-color:var(--page-line);color:var(--page-ink)}
.classic .small{color:inherit;opacity:.75}
.classic .group-title{color:inherit}
@media (max-width:760px){.toast{top:calc(env(safe-area-inset-top,0px) + 124px)}}
@media (max-width:520px){.dlg p{font-size:17px}.prompt{font-size:14px}.chip{font-size:14px;padding:6px 9px}}
@media (prefers-reduced-motion: reduce){.meter i{transition:none}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="A small pixel city. Each building opens one of Sajid's projects. Use Classic view for a plain page."></canvas>

<div class="hud">
  <div class="hud-left">
    <div class="panel chip"><strong>Sajid · <span id="area">Projects</span></strong><span id="count">Visited 0</span></div>
    <div class="panel chip" aria-live="off"><strong>Arlington, TX</strong><span id="clock">--:--</span></div>
  </div>
  <div class="hud-right">
    <button class="panel chip" id="mapBtn" type="button">Map</button>
    <button class="panel chip" id="skillsBtn" type="button">Skills</button>
    <button class="panel chip" id="tourBtn" type="button">Tour</button>
    <a class="panel chip gold" id="resumeBtn" target="_blank" rel="noopener" hidden>Resume</a>
    <button class="panel chip" id="classicBtn" type="button">Classic view</button>
  </div>
</div>

<canvas class="mini" id="mini" width="160" height="120" aria-hidden="true"></canvas>
<div class="panel prompt" id="prompt" hidden></div>
<div class="panel tourbar" id="tourBar" hidden><span id="tourText"></span><button class="btn ghost" id="tourStop" type="button">Stop</button></div>
<div class="panel toast" id="toast" role="status" hidden></div>
<button class="act" id="actBtn" type="button" aria-label="Open" hidden>A</button>

<div class="dialog" id="dialog" hidden>
  <div class="panel dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div id="dlgExtra" hidden></div>
    <div class="dlg-foot"><span id="dlgHint"></span><button class="btn ghost" id="dlgClose" type="button">Close</button></div>
  </div>
</div>

<div class="sheet" id="mapSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
    <div class="sheet-top"><h2 id="mapTitle">City map: five areas</h2><button class="btn ghost" data-close type="button">Close</button></div>
    <canvas id="bigMap" width="320" height="240" aria-hidden="true"></canvas>
    <div class="districts" id="districts"></div>
  </div>
</div>

<div class="sheet" id="skillsSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="skillsTitle">
    <div class="sheet-top"><h2 id="skillsTitle">Backpack</h2><button class="btn ghost" data-close type="button">Close</button></div>
    <div id="skillsBody"></div>
  </div>
</div>

<div class="classic" id="classic" hidden>
  <div class="wrap">
    <div class="top"><h1>Sajid's portfolio</h1><button class="btn" id="backBtn" type="button">Back to the city</button></div>
    <p class="lede">Everything from the city, as a plain page.</p>
    <div id="classicList"></div>
  </div>
</div>

<script>
(() => {
"use strict";

/* =====================================================================
   EDIT HERE. Empty links stay hidden until you fill them in.
   ===================================================================== */
const CONFIG = {
  gradDate: "May 2029",
  email: "you@example.com",
  github: "https://github.com/SH-Shad",
  linkedin: "https://www.linkedin.com/in/md-sajid-hossain-sad/",
  resume: "",
  links: {
    irop: "", iropDemo: "", churn: "", campuspos: "", finance: "", sql: "",
    geograph: "", geographLive: "", ats: "", pi: "", multiagent: "",
    supply: "", rag: "", weather: ""
  },
  social: { youtube: "", instagram: "", x: "" },   // add handles to show them in the Social Club
  photos: [],          // e.g. ["photos/event-1.jpg", "photos/event-2.jpg"]
  personal: {
    likes: ["Working on my 2007 Camry", "Collecting and layering fragrances", "Shooting photos and video", "Cooking with whatever is in the pantry"],
    dislikes: [],      // e.g. ["Cold coffee", "Slow Wi-Fi"]
    chill: ""          // e.g. "Late drive with music, then food."
  },
  liveWeather: true,
  car: { name: "2007 Toyota Camry LE", color: "#b9c0c9" },  // change color to match yours
  pet: { name: "Mimi" }                                      // the cat by your house
};
const code = k => CONFIG.links[k] || CONFIG.github;
const live = k => CONFIG.links[k] || "";

/* ===================== Small DOM helper ===================== */
let uid = 0;
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const row = (k,v) => h("div", null, h("span", null, k), h("span", null, v));
const board = rows => h("div", {class:"board"}, rows.map(([k,v]) => row(k,v)));

/* ===================== Widgets ===================== */
function wCascade(){
  const id = "u"+(++uid), val = h("b", null, "45"), out = h("tbody");
  const inp = h("input", {type:"range", min:"0", max:"120", step:"5", value:"45", id});
  const legs = [["DFW to AUS",0],["AUS to DFW",20],["DFW to MSY",15],["MSY to DFW",25],["DFW to OKC",10]];
  function upd(){
    val.textContent = inp.value; out.replaceChildren();
    let d = +inp.value;
    legs.forEach(([name,slack], i) => {
      if (i) d = Math.max(0, d-slack);
      const cls = d>=30 ? "bad" : d>0 ? "warn" : "ok";
      out.append(h("tr", null, h("td", null, name), h("td", null, i ? slack+" min" : "none"), h("td", {class:cls}, d ? "+"+d+" min" : "on time")));
    });
  }
  inp.addEventListener("input", upd); upd();
  return h("div", {class:"w"},
    h("p", {class:"group-title"}, "Try the cascade"),
    h("label", {for:id}, "First flight of the day leaves ", val, " min late"), inp,
    h("table", {class:"flights"}, h("thead", null, h("tr", null, h("th", null, "Leg"), h("th", null, "Slack"), h("th", null, "Delay"))), out),
    h("p", {class:"small"}, "One aircraft flying five legs. Spare ground time between flights (slack) absorbs part of the delay and the rest rides along. The slack values are made up to show the effect."));
}

function wChurn(){
  const ia="u"+(++uid), ib="u"+(++uid), ic="u"+(++uid);
  const prod = h("select", {id:ia}, [1,2,3,4].map(n => h("option", {value:n}, n + (n>1 ? " products" : " product"))));
  prod.value = "2";
  const ageV = h("b", null, "35"), age = h("input", {type:"range", min:"18", max:"80", value:"35", id:ib});
  const ctry = h("select", {id:ic}, ["France","Spain","Germany"].map(c => h("option", {value:c}, c)));
  const bar = h("i"), res = h("p", {class:"small"});
  function upd(){
    ageV.textContent = age.value;
    let p = {1:.27, 2:.08, 3:.82, 4:.97}[+prod.value];
    p += 0.28*Math.exp(-(((+age.value-52)/11)**2)) - 0.04;
    if (ctry.value === "Germany") p += 0.12;
    p = Math.max(.02, Math.min(.98, p));
    const seg = p<.3 ? "Low" : p<.6 ? "Medium" : "High";
    bar.style.width = Math.round(p*100)+"%";
    bar.style.background = seg==="Low" ? "#5fbf77" : seg==="Medium" ? "#f6c85f" : "#e0644f";
    res.textContent = "Estimated churn risk " + Math.round(p*100) + "%, " + seg + " risk segment.";
  }
  for (const x of [prod, age, ctry]) { x.addEventListener("input", upd); x.addEventListener("change", upd); }
  upd();
  return h("div", {class:"w"},
    h("p", {class:"group-title"}, "Toy risk checker"),
    h("label", {for:ia}, "Products held"), prod,
    h("label", {for:ib}, "Age ", ageV), age,
    h("label", {for:ic}, "Country"), ctry,
    h("div", {class:"meter"}, bar), res,
    h("p", {class:"small"}, "A rule-of-thumb toy built from the model's top drivers: number of products, age, and Germany. The real scores come from the XGBoost model in the repo."));
}

function wSQL(){
  const QS = [
    {q:"What share of orders were returned?", sql:"SELECT ROUND(100.0 * SUM(status = 'returned') / COUNT(*), 1) AS return_pct\nFROM orders;", rows:[["return_pct"],["22.6"]]},
    {q:"Which products bring in the most revenue?", sql:"SELECT p.name, ROUND(SUM(oi.quantity * oi.unit_price)) AS revenue\nFROM order_items oi\nJOIN products p ON p.product_id = oi.product_id\nGROUP BY p.name\nORDER BY revenue DESC\nLIMIT 5;", rows:[["name","revenue"],["Air Purifier","$12,497"],["Mechanical Keyboard","$11,348"]], note:"First two rows shown."},
    {q:"Delete all the customers", sql:"DELETE FROM customers;", err:"Blocked at stage 1: only SELECT statements are allowed to run."},
    {q:"Will it rain tomorrow?", sql:"CANNOT_ANSWER", err:"The database holds customers, products, and orders. It has no weather data, so the assistant declines instead of guessing."}
  ];
  const pre = h("pre", {class:"sql"}, "Pick a question."), res = h("div");
  let timer = null;
  function run(item){
    clearInterval(timer); res.replaceChildren(); pre.textContent = "";
    let i = 0;
    const done = () => {
      clearInterval(timer); pre.textContent = item.sql;
      if (item.err) { res.replaceChildren(h("p", {class:"small bad"}, item.err)); return; }
      const [head, ...body] = item.rows;
      res.replaceChildren(h("table", {class:"flights"}, h("thead", null, h("tr", null, head.map(c => h("th", null, c)))), h("tbody", null, body.map(r => h("tr", null, r.map(c => h("td", {class:"ok"}, c)))))), item.note ? h("p", {class:"small"}, item.note) : null);
    };
    if (reduceMotion) return done();
    timer = setInterval(() => { i += 3; pre.textContent = item.sql.slice(0, i); if (i >= item.sql.length) done(); }, 16);
  }
  return h("div", {class:"w"},
    h("p", {class:"group-title"}, "Ask the desk"),
    h("div", {class:"links"}, QS.map(item => h("button", {class:"btn ghost", type:"button", onclick:() => run(item)}, item.q))),
    pre, res,
    h("p", {class:"small"}, "These answers were recorded from real test runs. The live app calls the model each time."));
}

function wTerm(){
  const out = h("div", {class:"term", role:"log", "aria-live":"polite"});
  const inp = h("input", {type:"text", "aria-label":"Terminal command", autocomplete:"off", autocapitalize:"off", spellcheck:"false"});
  const print = s => { out.append(s + "\n"); out.scrollTop = out.scrollHeight; };
  print("Ubuntu Server 24.04 on a Raspberry Pi. Type help to see commands.");
  const hasResume = () => CONFIG.resume && CONFIG.resume !== "#";
  const CMDS = {
    help: () => "whoami  ls  ls projects  cat about.txt  cat resume.txt  uname -a  uptime  date  clear  exit",
    whoami: () => "sajid: Information Systems student at UT Arlington",
    ls: () => "about.txt  projects/  resume.txt",
    "ls projects": () => "irop-command-center/  bank-churn-dashboard/  supply-chain-risk-platform/\ntext-to-sql-assistant/  geograph/  logistics-rag-assistant/\nweather-pipeline/  campuspos/  finance-agent/  ats-analyzer/\nmulti-agent-report-generator/",
    "cat about.txt": () => "I build data, ML, and AI projects, and I like taking things apart to see why they broke. My car included.",
    "cat resume.txt": () => hasResume() ? "Opening the resume in a new tab." : "resume.txt: ask me for a copy at " + CONFIG.email,
    "uname -a": () => "Linux shed 6.8.0 aarch64 GNU/Linux",

const ROT = [["EKMFLGDQVZNTOWYHXUSPAIBRCJ","Q"],["AJDKSIRUXBLHWTMCQGZNPYFVOE","E"],["BDFHJLCPRTXVZNYEIWGAKMUSQO","V"]];
const REF = "YRUHQSLDPXNGOKMIEBFZCWVJAT";
const INV = ROT.map(r => { const a=[]; for (let i=0;i<26;i++) a[r[0].charCodeAt(i)-65]=i; return a; });
function enigma(text){
  const pos=[0,0,0]; let out="";
  const fwd=(r,c,p)=>(ROT[r][0].charCodeAt((c+p)%26)-65-p+26)%26, back=(r,c,p)=>(INV[r][(c+p)%26]-p+26)%26;
  for (const ch of text.toUpperCase()) {
    const c0 = ch.charCodeAt(0)-65;
    if (c0<0 || c0>25) { if (ch===" ") out+=" "; continue; }
    const mN = pos[1]===ROT[1][1].charCodeAt(0)-65, rN = pos[2]===ROT[2][1].charCodeAt(0)-65;
    if (mN) { pos[0]=(pos[0]+1)%26; pos[1]=(pos[1]+1)%26; } else if (rN) pos[1]=(pos[1]+1)%26;
    pos[2]=(pos[2]+1)%26;
    let c=c0; c=fwd(2,c,pos[2]); c=fwd(1,c,pos[1]); c=fwd(0,c,pos[0]); c=REF.charCodeAt(c)-65; c=back(0,c,pos[0]); c=back(1,c,pos[1]); c=back(2,c,pos[2]);
    out += String.fromCharCode(c+65);
  }
  return out;
}

/* ===================== Pathfinding ===================== */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(fx,fy,gx,gy){
  const sx=Math.floor(fx/T), sy=Math.floor((fy-4)/T), tx=Math.floor(gx/T), ty=Math.floor((gy-4)/T);
  if (!inb(tx,ty) || !walk[ty*MW+tx] || !inb(sx,sy)) return null;
  const start=sy*MW+sx, goal=ty*MW+tx, prev=new Int32Array(MW*MH).fill(-1), q=[start];
  prev[start]=start;
  for (let i=0;i<q.length;i++) {
    const c=q[i]; if (c===goal) break;
    const cx=c%MW, cy=(c/MW)|0;
    for (const [dx,dy] of DIRS) { const nx=cx+dx, ny=cy+dy; if (!inb(nx,ny)) continue; const n=ny*MW+nx; if (prev[n]!==-1 || !walk[n]) continue; prev[n]=c; q.push(n); }
  }
  if (prev[goal]===-1) return null;
  const pts=[];
  for (let c=goal; c!==start; c=prev[c]) pts.push({x:(c%MW)*T+8, y:((c/MW)|0)*T+12});
  pts.push({x:sx*T+8, y:sy*T+12});
  return pts.reverse();
}

  if (car.x!=null) { const d=Math.hypot(player.x-car.x, player.y-(car.y-5)); if (d<30 && d<bd) { bd=d; best=CAR_ITEM; } }

  if (n.pet && catUpdate(n, dt)) return;
  if (n.path && n.path.length) {
    const p=n.path[0], dx=p.x-n.x, dy=p.y-n.y, d=Math.hypot(dx,dy), st=n.speed*dt;
    if (d<=st) { n.x=p.x; n.y=p.y; n.path.shift(); } else { n.x+=dx/d*st; n.y+=dy/d*st; }
    if (dx||dy) { n.face = Math.abs(dx)>Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up"); if (Math.abs(dx)>0.01) n.hface = dx>0?"right":"left"; }
    n.moving=true; n.anim+=dt;

  n.moving=false; n.anim=0; n.wait-=dt;

  if (n.r===0) { n.face=["down","left","right","down"][Math.floor(Math.random()*4)]; n.wait=2+Math.random()*3; return; }

  const cat = npcs.find(n => n.pet), nm = CONFIG.pet.name, out = h("p", {class:"small"}, "What do you want to do?");
  const btn = (label, fn) => h("button", {class:"btn", type:"button", onclick:fn}, label);
  return h("div", {class:"w"}, h("div", {class:"links"},
    btn("Pet her", () => { addHearts(cat.x, cat.y-12, 3); out.textContent = PET_LINES[Math.floor(Math.random()*PET_LINES.length)]; }),
    btn("Feed her", () => {
      if (cat.fedAt!=null && t-cat.fedAt < 40) { out.textContent = nm + " sniffs the bowl and walks off. She's still full."; return; }
      cat.fedAt=t; BOWL.full=true; cat.follow=false; cat.talkT=0; crumbs.length=0;
      npcGo(cat, BOWL.x-9, BOWL.y, () => { cat.eatT=6; });
      closeDialog(); toast("You filled the bowl. " + nm + " is on her way.");
    }),
    btn(cat.follow ? "Let her roam" : "Follow me", () => {
      cat.follow = !cat.follow; cat.talkT=0; cat.path=null; crumbs.length=0;
      if (!cat.follow) npcGo(cat, cat.hx*T+8, cat.hy*T+12);
      closeDialog(); toast(cat.follow ? nm + " is following you." : nm + " heads back to her house.");
    })), out);
}
function startDriving(){
  if (car.x==null) return;
  player.driving=true; player.x=car.x; player.y=car.y; player.face=car.face; car.x=null;
  route=null; if (tour) stopTour(); lastPrompt="#"; updatePrompt();
  toast("You're driving. " + (coarse ? "Tap A to park." : "Press E to park."));
}
function park(){
  if (!player.driving) return;
  const px=player.x, py=player.y;
  car.x=px; car.y=py; car.face=player.face; player.driving=false;
  for (const [ox,oy] of [[0,16],[0,-20],[-18,0],[18,0],[0,26],[-18,14],[18,14],[0,-28]]) {
    if (!blocked(px+ox, py+oy)) { player.x=px+ox; player.y=py+oy; player.face="down"; lastPrompt="#"; updatePrompt(); return; }
  }
  player.driving=true; car.x=null; toast("No room to get out here. Try a wider spot.");
}
function valet(){ player.driving=false; Object.assign(car, CAR_HOME); }

const runway = {u:[0,-70,-140], L:33*T};
const rick = {x:11*T, dir:1};
let overhead = {next:12, x:0, on:false}, clockT = -5, curArea = null;

function update(dt){
  t += dt;
  if (tapMark) { tapMark.life-=dt; if (tapMark.life<=0) tapMark=null; }
  const paused = t%14 > 10.5;
  if (!paused) runway.u[0] += 22*dt;
  for (let i=1;i<runway.u.length;i++) runway.u[i] = Math.min(runway.u[i]+22*dt, runway.u[i-1]-26);
  rick.x += rick.dir*18*dt; if (rick.x>36*T) rick.dir=-1; if (rick.x<12*T) rick.dir=1;
  if (!overhead.on && t>overhead.next) overhead = {on:true, x:-60, next:0};
  if (overhead.on) { overhead.x += 70*dt; if (overhead.x > viewW+60) overhead = {on:false, next:t+35}; }
  const pet = npcs.find(n => n.pet);
  if (pet && pet.follow && !player.driving) { const last=crumbs[crumbs.length-1]; if (!last || Math.hypot(player.x-last.x, player.y-last.y)>6) crumbs.push({x:player.x, y:player.y}); if (crumbs.length>60) crumbs.shift(); }
  for (let i=hearts.length-1;i>=0;i--) { hearts[i].y -= 14*dt; hearts[i].life -= dt; if (hearts[i].life<=0) hearts.splice(i,1); }
  if (t - clockT > 1) { clockT = t; const cl=$("clock"); if (cl) cl.textContent = (clockFmt ? clockFmt.format(new Date()) : new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})) + (wx ? ", " + Math.round(wx.temp) + "°F" : ""); }
  for (const n of npcs) npcUpdate(n, dt);
  for (const c of traffic) trafficUpdate(c, dt);
  for (const p of pigeons) pigeonUpdate(p, dt);

  if (!stopEvt.done && !stopEvt.active && t>stopEvt.at && !dlgItem && !overlay && !tour) {
    const ch = npcs.find(n => n.chief);
    if (ch) { stopEvt.active=true; ch.path=null; ch.talkT=0; ch.chasing=true; const side = Math.random()<.5 ? -1 : 1; ch.x = player.x + side*(viewW/2+10); ch.y = player.y; route=null; for (const k in keys) keys[k]=false; toast("\"Hey, you! Hold up!\""); }
  }
  if (stopEvt.done===false && t>stopEvt.at && tour) stopEvt.at = t + 20;
  const ar = areaAt(player.x, player.y);
  if (ar && ar!==curArea) { if (curArea) toast("Now entering: " + ar.name); curArea = ar; const ae=$("area"); if (ae) ae.textContent = ar.name; }
  if (dlgItem || overlay || stopEvt.active) { player.moving=false; if (stopEvt.active && !dlgItem) near=null; return; }
  const vx=(keys.right?1:0)-(keys.left?1:0), vy=(keys.down?1:0)-(keys.up?1:0);
  let moving=false;
  if (vx || vy) {
    const len=Math.hypot(vx,vy), sp=SPEED*(player.driving?2.2:1)*dt;
    tryMove(vx/len*sp, vy/len*sp); moving=true; faceTo(vx,vy);
  } else if (route) {
    let budget = SPEED*(tour?2.6:player.driving?2.2:1)*dt;
    while (budget>0 && route && route.pts.length) {
      const p=route.pts[0], dx=p.x-player.x, dy=p.y-player.y, d=Math.hypot(dx,dy);
      if (d<0.01) { route.pts.shift(); continue; }
      const s=Math.min(d,budget); faceTo(dx,dy);
      if (!tryMove(dx/d*s, dy/d*s)) { route=null; break; }
      moving=true; budget-=s; if (s===d) route.pts.shift();
    }
    if (route && !route.pts.length) {
      const it=route.item; route=null;
      if (it && !player.driving) { near=findNear(); if (near===it) { player.face="up"; openDialog(it); return; } }
    }
  }
  player.moving=moving; player.anim = moving ? player.anim+dt : 0;
  near=findNear(); updatePrompt();
}

function render(){
  updateCam();
  ctx.fillStyle="#2e6a45"; ctx.fillRect(0,0,viewW,viewH);
  ctx.save(); ctx.translate(-cam.x,-cam.y);
  ctx.drawImage(wc,0,0);
  if (!reduceMotion) {
    const fr=Math.floor(t*2);
    for (const [tx,ty] of waterTiles) {
      if (tx*T < cam.x-T || tx*T > cam.x+viewW || ty*T < cam.y-T || ty*T > cam.y+viewH) continue;
      if (hash(tx,ty,fr) < 0.14) { const sx=tx*T+3+Math.floor(hash(tx,ty,fr+500)*9), sy=ty*T+4+Math.floor(hash(tx,ty,fr+900)*8); ctx.fillStyle="#f2fbff"; ctx.fillRect(sx,sy,2,1); ctx.fillRect(sx+1,sy-1,1,1); }
    }
  }
  for (const u of runway.u) { const px=3*T+((u%runway.L)+runway.L)%runway.L, py=4*T-7; outlined(ctx, px-8, py-8, a => drawPlane(a,8,8,1)); }
  outlined(ctx, Math.round(rick.x)-8, 55*T+2-8, a => drawRickshaw(a,8,8,rick.dir));
  for (const b of buildings) {
    if (b.led) { ctx.fillStyle = (t%1.2<0.6) ? "#5fdc7a" : "#1f5a2e"; ctx.fillRect(b.led.x,b.led.y,3,3); }
    if (b.anemo) { const a=t*6; ctx.fillStyle="#3d4a58"; for (let k=0;k<3;k++) ctx.fillRect(Math.round(b.anemo.x+Math.cos(a+k*2.09)*4)-1, Math.round(b.anemo.y+Math.sin(a+k*2.09)*2)-1, 2, 2); }
  }
  if (tapMark) { ctx.globalAlpha=Math.max(0,tapMark.life/0.6); ctx.fillStyle="#f2e8cf"; for (let i=-2;i<=2;i++) { ctx.fillRect(tapMark.x+i,tapMark.y-4+i,1,1); ctx.fillRect(tapMark.x+i,tapMark.y-4-i,1,1); } ctx.globalAlpha=1; }
  const inView = (x,y,m) => x>cam.x-m && x<cam.x+viewW+m && y>cam.y-m && y<cam.y+viewH+m+24;
  const ds = [];
  ds.push({y:player.y, f:() => player.driving ? drawCarAt(ctx,player.x,player.y,player.face,CONFIG.car.color) : drawPlayer(ctx)});
  if (car.x!=null && inView(car.x,car.y,30)) ds.push({y:car.y, f:() => drawCarAt(ctx,car.x,car.y,car.face,CONFIG.car.color)});
  for (const n of npcs) if (inView(n.x,n.y,24)) ds.push({y:n.y, f:() => n.kind==="person" ? drawCharAt(ctx,n) : drawAnimalAt(ctx,n)});
  for (const c of traffic) if (c.x>c.L.x0-4 && c.x<c.L.x1+4 && inView(c.x,c.L.y,30)) ds.push({y:c.L.y, f:() => drawCarAt(ctx,c.x,c.L.y,c.L.dir>0?"right":"left",c.color)});
  for (const p of pigeons) if (p.state==="ground" && inView(p.x,p.y,10)) ds.push({y:p.y+4, f:() => drawPigeon(ctx,p)});
  for (const d of decos) if (d.spr && inView(d.sx+d.spr.width/2, d.ty*T, 80)) ds.push({y:d.ty*T+15, f:() => ctx.drawImage(d.spr, d.sx, d.sy)});
  if (inView(BOWL.x,BOWL.y,20)) ds.push({y:BOWL.y-1, f:() => { ctx.fillStyle=OUTLINE; ctx.fillRect(BOWL.x-4,BOWL.y-4,9,4); ctx.fillStyle="#3f7fd0"; ctx.fillRect(BOWL.x-3,BOWL.y-3,7,2); ctx.fillStyle="#6aa2ea"; ctx.fillRect(BOWL.x-3,BOWL.y-3,7,1); if (BOWL.full) { ctx.fillStyle="#b0703a"; ctx.fillRect(BOWL.x-2,BOWL.y-4,5,1); ctx.fillStyle="#d8944e"; ctx.fillRect(BOWL.x-1,BOWL.y-5,3,1); } }});
  ds.sort((a,b) => a.y-b.y);
  for (const d of ds) d.f();
  ctx.drawImage(oc,0,0);
  for (const p of pigeons) if (p.state==="fly") drawPigeon(ctx,p);
  const ph = lightPhase(), blinkOn = Math.floor(t*2)%2===0;
  for (const n of npcs) if (n.chief && (n.chasing || dlgItem===CHIEF_STOP)) { const on=Math.floor(t*8)%2; ctx.fillStyle=on?"#ff4a3a":"#3f7fd0"; ctx.fillRect(Math.round(n.x)-4,Math.round(n.y)-30,3,3); ctx.fillStyle=on?"#3f7fd0":"#ff4a3a"; ctx.fillRect(Math.round(n.x)+1,Math.round(n.y)-30,3,3); }
  for (const d of decos) {
    if (d.tl && inView(d.tl.x,d.tl.y,20)) {
      const cols = [["red","#ff4a3a","#5a2222"],["yellow","#ffd23f","#5a4a1a"],["green","#5fdc7a","#1f4a2a"]];
      cols.forEach(([name,on,off],k) => { ctx.fillStyle = ph===name ? on : off; ctx.fillRect(d.tl.x, d.tl.y+k*4, 4, 3); if (ph===name) { ctx.fillStyle="rgba(255,255,255,.6)"; ctx.fillRect(d.tl.x, d.tl.y+k*4, 1, 1); } });
    }
    if (d.blink && inView(d.blink.x,d.blink.y,20)) { ctx.fillStyle = blinkOn ? "#ffb13a" : "#7a4a1a"; ctx.fillRect(d.blink.x, d.blink.y, 2, 2); }
  }
  for (const hr of hearts) {
    ctx.globalAlpha = Math.min(1, hr.life); ctx.fillStyle="#ff5a7a";
    const hx=Math.round(hr.x), hy=Math.round(hr.y);
    if (hr.note) { ctx.fillStyle="#5ff0ff"; ctx.fillRect(hx+3,hy,1,5); ctx.fillRect(hx+3,hy,3,1); ctx.fillRect(hx+5,hy,1,2); ctx.fillRect(hx+1,hy+4,3,2); }
    else { for (const [a,b,c2,d2] of [[1,0,2,1],[4,0,2,1],[0,1,7,2],[1,3,5,1],[2,4,3,1],[3,5,1,1]]) ctx.fillRect(hx+a,hy+b,c2,d2); ctx.fillStyle="#ffc6d2"; ctx.fillRect(hx+1,hy+1,1,1); }
  }
  ctx.globalAlpha = 1;
  const bob = reduceMotion ? 0 : Math.round(Math.sin(t*4)*1.5);
  for (const it of counted) if (!visited.has(it.id)) drawArrow(ctx, it.markX, it.markY+bob);
  ctx.restore();
  if (overhead.on) { const y=Math.round(viewH*0.22); drawPlane(ctx, Math.round(overhead.x+18), y+34, 2, true); outlined(ctx, Math.round(overhead.x)-8, y-8, a => drawPlane(a,8,8,2)); }
  if (raining()) {
    ctx.fillStyle="rgba(40,50,80,.18)"; ctx.fillRect(0,0,viewW,viewH);
    ctx.fillStyle="rgba(190,210,255,.55)";
    for (const d of drops) { if (!reduceMotion) { d.y += d.v*0.02; d.x -= 0.002; if (d.y>1) { d.y=0; d.x=Math.random(); } if (d.x<0) d.x=1; } ctx.fillRect(Math.round(d.x*viewW), Math.round(d.y*viewH), 1, 3); }
  }
  if (isNight()) {
    ctx.fillStyle="rgba(25,30,85,.38)"; ctx.fillRect(0,0,viewW,viewH);
    for (const d of decos) if (d.glow) {
      const gx=d.glow.x-cam.x, gy=d.glow.y-cam.y;
      if (gx<-30 || gy<-30 || gx>viewW+30 || gy>viewH+30) continue;
      for (const [r,a] of [[22,.10],[14,.14],[7,.2]]) { ctx.fillStyle="rgba(255,205,110,"+a+")"; ctx.beginPath(); ctx.arc(gx,gy+6,r,0,Math.PI*2); ctx.fill(); }
    }
  }
  if (miniEl.getClientRects().length && getComputedStyle(miniEl).display !== "none") {
    miniCtx.drawImage(mc,0,0);
    miniCtx.strokeStyle="#f2e8cf"; miniCtx.lineWidth=1; miniCtx.strokeRect(Math.round(cam.x/8)+.5, Math.round(cam.y/8)+.5, Math.round(viewW/8), Math.round(viewH/8));
    miniCtx.fillStyle="#f6c85f"; miniCtx.fillRect(Math.round(player.x/8)-1, Math.round(player.y/8)-2, 3, 3);
  }
}
let last=0;
function loop(now){ const dt=Math.min(0.05,(now-(last||now))/1000); last=now; update(dt); render(); requestAnimationFrame(loop); }

async function boot(){
  try { await Promise.race([document.fonts.load("8px Silkscreen"), new Promise(r => setTimeout(r,1500))]); } catch(e){}
  buildMap(); buildDeco(); buildWalk(); spawnNpcs(); renderWorld();
  const m = mc.getContext("2d"); m.imageSmoothingEnabled = true; m.drawImage(wc,0,0,160,120);
  buildSheets(); updateHud(); resize();
  canvas.focus({preventScroll:true});
  requestAnimationFrame(loop);
  loadWeather(); setInterval(loadWeather, 15*60*1000);
  if (!store.get("pc-seen")) { store.set("pc-seen","1"); setTimeout(() => openDialog(byId.welcome), 500); }
}
boot();
})();
</script>
